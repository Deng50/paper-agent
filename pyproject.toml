[project]
name = "lit-agent"
version = "0.1.0"
description = "个人文献情报员 · 单 agent + 文件系统记忆 + skill 教程（v0.4）"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }

# M1 已锁基座依赖。版本理由见 CLAUDE.md §3 / docs。
# 推迟到 M2/M3 的依赖（deepagents / langchain-anthropic / APScheduler /
# sse-starlette / aiosmtplib / jinja2 / paper-search-mcp）用到时再加，引入前先报 owner。
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings==2.14.1",
    "structlog==25.5.0",
    "fastapi==0.136.1",
    "uvicorn[standard]==0.47.0",
    "sqlalchemy==2.0.49",
    "alembic==1.18.4",
    "psycopg[binary]==3.3.4",
    "langgraph==1.1.0",
    "langgraph-checkpoint-postgres==3.1.0",
    "streamlit==1.57.0",
    "httpx>=0.27",
    "anthropic==0.102.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.12",
    "mypy==2.1.0",
    "pytest==9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lit_agent"]

[tool.uv]
package = true

# ---- 质量门禁配置 ----

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# E/F pyflakes+pycodestyle, I import-sort, UP pyupgrade, B bugbear, SIM simplify
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# E501 行长由 formatter 处理；RUF001/2/3 是 ambiguous-unicode（对中文注释敌对），全项目中文注释故关闭
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
# 第三方无类型存根的库豁免（按需收紧）
[[tool.mypy.overrides]]
module = ["streamlit.*", "langgraph.*", "langgraph_checkpoint_postgres.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -q"

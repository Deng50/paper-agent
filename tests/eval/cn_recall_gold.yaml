# 中文召回率黄金集（M4 task 7 / docs/05 §5）
#
# 验收硬指标（docs/05 §5）：
#   - 跨日召回（文献）5 题 ≥ 4/5
#   - 跨日召回（对话）≥ 4/5；scope=sessions 优先
#   - 中文召回率 < 85% 触发 M7 SQLite FTS5 评估（docs/02 §5.5）
#
# 评分口径：Top-3 命中 = 1（agent search_memory 返回前 3 个文件路径中至少 1 个
#         落入 expected_paper_ids / expected_session_ids）。Top-1 / Top-3 / Top-5
#         三档同时输出，便于看口径敏感性（scripts/eval_cn_recall.py）。
#
# 主题分布（基于 M3 真 corpus 37 篇 score 7-9 frequency）：
#   - A 硫化物固态电解质 / argyrodite / Li6PS5Cl —— corpus 12+ 篇
#   - B 锂金属负极界面工程 / dendrite / interphase —— corpus 10+ 篇
#   - D 聚合物 / 复合固态电解质 / PEO / PVDF / nanofiber —— corpus 4 篇
#   每主题各 1-2 题，凑足 5 文献 + 5 对话 = 10 题。
#
# F 电池热管理（CLAUDE.md §1 字面方向）M3 corpus 仅 1 篇，是 corpus 稀缺警示项，
# 单独评估不污染主结论（详见末尾 f_corpus_warning）。
#
# 题目设计：每题给中文 + 英文双 query 版本 + 难度标签
#   - direct：中文 reason / 为什么推荐你 字段直接含 query token
#   - synonym：需要中→英 token 转换（"argyrodite" / "garnet" 等专业词）
#   - fuzzy：模糊指代 + 同义词（"枝晶" → dendrite）

version: 2  # v2：每题加 query_zh / query_en / difficulty
verdict_threshold: top_3
verdict_pass_ratio: 0.8

paper_questions:
  # ---------- 主题 A — 硫化物固态电解质 ----------
  - id: paper_A1
    theme: A_sulfide_solid_electrolyte
    question: "上次推过的硫化物全固态电池里那篇关于聚合物粘合剂的论文用了什么策略？"
    query_zh: "氢键 粘合剂 硫化物"
    query_en: "hydrogen bond polymer binder sulfide"
    expected_paper_ids:
      - openalex-w7161571770  # Hydrogen-Bond-Networked Robust Binder ... Sulfide All-Solid-State
    scope: papers
    difficulty: direct
    notes: "中文 reason 字面含「氢键聚合物粘合剂用于硫化物全固态锂电池」"

  - id: paper_A2
    theme: A_sulfide_solid_electrolyte
    question: "我们看过几篇 argyrodite 类电解质的论文？"
    query_zh: "argyrodite"  # 专业词，中文 reason 可能保留原文
    query_en: "argyrodite Li-argyrodite"
    expected_paper_ids:
      - openalex-w7162143664  # Insights into interfacial reactions ... Li-argyrodite
      - openalex-w7162192345  # Boosting moisture stability ... argyrodite electrolytes
      - s2-1b8166c55ab8181178cc75bd0d03eb2b0462ab72  # Argyrodite Solid Electrolytes
    scope: papers
    difficulty: synonym
    notes: "argyrodite 是专业矿石名（硫银锗矿），中文 reason 通常保留英文原词"

  # ---------- 主题 B — 锂金属负极界面工程 ----------
  - id: paper_B1
    theme: B_li_metal_anode_interface
    question: "之前推过的关于抑制锂枝晶的策略有哪些？"
    query_zh: "枝晶 锂金属"
    query_en: "dendrite suppression lithium metal"
    expected_paper_ids:
      - openalex-w7161839484  # Quantum-AI suppressing dendrites in lithium-metal solid-state
    scope: papers
    difficulty: fuzzy
    notes: |
      枝晶 ↔ dendrite 同义；模糊问。
      历史误标修正（M5 P1 ④ 归因发现）：openalex-w7161840358 实为
      「Adaptive Piezoelectric ... SODIUM Metal Batteries」（钠金属电池，非锂），
      不属于 B_li_metal_anode_interface 主题，已从 expected_paper_ids 移除（commit log）。

  - id: paper_B2
    theme: B_li_metal_anode_interface
    question: "garnet 固态电解质对锂金属负极的界面稳定性那篇怎么处理的？"
    query_zh: "garnet 界面 锂金属"
    query_en: "garnet solid electrolyte lithium metal interface"
    expected_paper_ids:
      - openalex-w7162119899  # Inorganic interphases garnet-Li interface
    scope: papers
    difficulty: synonym
    notes: "garnet 中文常直接用英文，reason 字段可能英文/中文混"

  # ---------- 主题 D — 聚合物 / 复合固态电解质 ----------
  - id: paper_D1
    theme: D_polymer_composite_electrolyte
    question: "PVDF 基聚合物固态电解质有什么新设计？"
    query_zh: "PVDF 聚合物 电解质"
    query_en: "PVDF polymer solid-state electrolyte"
    expected_paper_ids:
      - openalex-w7161850972  # PVDF Solid-State Electrolytes 双网络
    scope: papers
    difficulty: direct
    notes: "PVDF 中英文 reason 都常出现"

session_questions:
  # 注：session 题需 M4 chat 路由跑通累积真 chat 历史后由 owner 填具体 session_id
  # （session md 路径形如 ./memory/sessions/{date}/{HH-MM}-chat.md，basename 用作 id）
  # 占位 query 已写好，expected_session_ids 待 demo 后填
  #
  # ───── P1 ③ 实测决策（owner 拍板 Option 1，本轮留空 + 撂着） ─────
  # 截 2026-05-26 的 chat 历史共 10 条（memory/sessions/2026-05-{25,26}/），
  # mtime 降序 top 5 主题分布：
  #   - AI/ML for batteries（DL/RL/ML 用于电池材料设计/BMS）：4 条
  #   - 浏览推送元话题（"今天推送了什么"/摘要请求）：1 条
  #   bottom 5 全是浏览推送元话题或寒暄。
  # 与下方 A 硫化物 / B 锂金属 / D 聚合物 主题预设不匹配，无法凑出干净的
  # ground truth（横跨 2 主题的会按 owner 护栏「排除」处理）。
  #
  # 本轮决策：expected_session_ids 全部留空 [] 不填，记账撂着。
  # 后续路径：等 M5 画像自更新跑起来累积更针对性的 chat 历史后重评，
  # 或在累积 ≥ 20 条 chat 后重新挑选。详见对应 git commit message。

  - id: session_A1
    theme: A_sulfide_solid_electrolyte
    question: "我们之前怎么讨论的氢键粘合剂在硫化物里的应用？"
    query_zh: "氢键 粘合剂"
    query_en: "hydrogen bond binder"
    expected_session_ids: []  # TODO M4 demo 后 owner 填
    scope: sessions
    difficulty: direct
    notes: "对话题；M4 chat 累积后 owner 填"

  - id: session_A2
    theme: A_sulfide_solid_electrolyte
    question: "argyrodite 那篇论文我们的看法是什么？"
    query_zh: "argyrodite"
    query_en: "argyrodite"
    expected_session_ids: []
    scope: sessions
    difficulty: synonym
    notes: "对话题"

  - id: session_B1
    theme: B_li_metal_anode_interface
    question: "锂枝晶抑制我们提过哪几种思路？"
    query_zh: "枝晶 抑制"
    query_en: "dendrite suppression"
    expected_session_ids: []
    scope: sessions
    difficulty: fuzzy
    notes: "对话题"

  - id: session_B2
    theme: B_li_metal_anode_interface
    question: "garnet 界面那个论文我们怎么解读的？"
    query_zh: "garnet 界面"
    query_en: "garnet interface"
    expected_session_ids: []
    scope: sessions
    difficulty: synonym
    notes: "对话题"

  - id: session_D1
    theme: D_polymer_composite_electrolyte
    question: "PVDF 电解质我们聊过哪些方面？"
    query_zh: "PVDF"
    query_en: "PVDF"
    expected_session_ids: []
    scope: sessions
    difficulty: direct
    notes: "对话题"

# F 警示项：corpus 稀缺，单独算分不污染主结论（路径 (ii)，Q5 owner 拍板）
f_corpus_warning:
  theme: F_thermal_management
  corpus_count: 1
  corpus_evidence: "./memory/papers/2026-05-22/arxiv-2605.21619v1.md (score 7.0, 唯一一篇)"
  expected_recall: "near 0 due to corpus sparsity (not algorithmic failure)"
  paper_questions: []     # 若 owner 想加 F 对照题，按 paper_questions 同结构填
  session_questions: []   # 同上
  notes: |
    评估报告须单独算分附在末尾，不计入主集 verdict_pass_ratio。
    若 F 召回率非 0，说明 grep 在 corpus 稀缺时仍有兜底（少量命中 = 该篇 reason
    字段含中文主题词）。M7 SQLite FTS5 触发条件 < 85% 不基于 F 单独算分。
